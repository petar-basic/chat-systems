name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs on a PR branch; never cancel a run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4

      # A change to the workflow itself re-verifies both sides — otherwise a
      # broken filter could disable the checks it is supposed to select.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            # The E2E job drives the whole stack, so the compose topology and
            # the seed script are inputs to it even though neither language job
            # depends on them.
            e2e:
              - 'backend/**'
              - 'frontend/**'
              - 'docker/**'
              - 'docker-compose*.yml'
              - 'seed.sh'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'

  backend:
    name: Backend (Rust)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://chat:devpassword@localhost:5432/chatsystems
      REDIS_URL: redis://localhost:6379
      # CI-only secret; >=32 chars so JWT (HS256) key validation passes.
      JWT_SECRET: ci-test-jwt-secret-please-change-0123456789
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: chatsystems
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat -d chatsystems"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Pinned (not @stable) so clippy lints are reproducible: a new stable
      # release must not turn CI red on lints that can't be reproduced locally.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace

      - name: cargo test
        run: cargo test --workspace

      - name: Install cargo tooling
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,sqlx-cli

      - name: cargo audit
        run: cargo audit

      # Compile-time-checked queries resolve against the committed .sqlx cache
      # when no database is reachable — which is exactly the case in the image
      # build. A query added without regenerating the cache breaks the Docker
      # build, so catch it here instead.
      - name: sqlx offline cache is current
        run: cargo sqlx prepare --check --workspace -- --all-targets

  frontend:
    name: Frontend (Node)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc -b

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  # Drives the real topology (nginx in front of api/worker/realtime) rather than
  # a bespoke service matrix, because the specs assume it — one of them restarts
  # the realtime container mid-test.
  e2e:
    name: E2E (Playwright)
    needs: [changes, backend, frontend]
    if: >-
      !cancelled()
      && needs.backend.result != 'failure'
      && needs.frontend.result != 'failure'
      && needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate CI secrets
        run: ./.github/scripts/ci-env.sh

      - name: Start the stack
        run: docker compose --profile frontend up -d --build

      - name: Wait for readiness
        run: |
          for target in "api:3000" "worker:3005" "realtime:3004"; do
            name="${target%%:*}"
            port="${target##*:}"
            for i in $(seq 1 60); do
              if docker compose exec -T "$name" curl -fsS "http://127.0.0.1:${port}/readyz" >/dev/null 2>&1; then
                echo "$name ready"
                break
              fi
              if [ "$i" = "60" ]; then
                echo "$name never became ready"
                exit 1
              fi
              sleep 2
            done
          done
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/ >/dev/null 2>&1 && break
            [ "$i" = "60" ] && { echo "frontend never served"; exit 1; }
            sleep 2
          done
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8090/chat/.well-known/openid-configuration >/dev/null 2>&1 && break
            [ "$i" = "60" ] && { echo "the mock identity provider never came up"; exit 1; }
            sleep 2
          done

      - name: Seed demo data
        run: ./seed.sh

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_SHOTS: ${{ runner.temp }}/shots
        run: E2E_PASSWORD="$ADMIN_PASSWORD" npm run test:e2e

      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color > "${{ runner.temp }}/compose-logs.txt"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/shots/
            ${{ runner.temp }}/compose-logs.txt
          if-no-files-found: ignore
          retention-days: 7

  # The only job that should be a required status check. It always runs, so it
  # always reports — a required check on a conditional job never reports at all
  # on a PR that skips it, and blocks the merge forever. Skipped counts as
  # passing here; a real failure or a cancellation still blocks.
  gate:
    name: All checks
    needs: [changes, backend, frontend, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
