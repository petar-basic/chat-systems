name: Deploy staging

# Images are built here, not on the VPS: a 2 vCPU / 4 GB box cannot compile 535
# Rust crates without OOM-ing, and Coolify then only has to pull.
# Runs after CI passes on main. Coolify's own auto-deploy fires on every push
# regardless of test results, so that toggle stays off and this is the trigger.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Layer cache lives in the registry, not the Actions cache: the Rust
      # dependency layer alone would eat a large share of the 10 GB repo budget.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/chat-systems-${{ matrix.name }}:main
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/chat-systems-${{ matrix.name }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/chat-systems-${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/chat-systems-${{ matrix.name }}:buildcache,mode=max

  deploy:
    name: Trigger Coolify
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Call Coolify deploy webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          status=$(curl -sS -X POST -o response.txt -w '%{http_code}' \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Accept: application/json" \
            -H "Content-Length: 0" \
            "$COOLIFY_WEBHOOK")
          cat response.txt
          test "$status" -lt 300
