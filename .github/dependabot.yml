version: 2
updates:
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # TypeScript 7 is out, but typescript-eslint still peer-requires <6.1.0,
      # so a major bump here makes `npm ci` unresolvable. Drop this entry once
      # typescript-eslint ships support.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # dtolnay/rust-toolchain publishes a branch for every future Rust release
      # (1.120.0 existed in October 2026, two years early), so Dependabot offers
      # toolchains that cannot be installed. The version moves by hand, together
      # with `rust-version` in backend/Cargo.toml and the cargo-chef image.
      - dependency-name: dtolnay/rust-toolchain
