<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` non-zero on a
      notched phone; without it the composer sits under the home indicator.
      `interactive-widget=resizes-content` makes the virtual keyboard shrink the
      viewport instead of scrolling the page out from under the composer. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Chat Systems</title>
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('chat_theme');
        } catch (e) {
          stored = null;
        }
        var resolved =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        document.documentElement.dataset.theme = resolved;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', resolved === 'light' ? '#eef1f6' : '#0f172a');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
