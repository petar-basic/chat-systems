<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>{{ title }}</title>
  </head>
  <body style="margin:0;padding:48px 16px;background:#f4f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1d1c1d;">
    <main style="max-width:460px;margin:0 auto;background:#ffffff;border:1px solid #e6e6e9;border-radius:16px;padding:32px 28px;">
      <h1 style="margin:0 0 12px;font-size:20px;line-height:28px;font-weight:700;">{{ heading }}</h1>
      {% for line in lines %}<p style="margin:0 0 16px;font-size:15px;line-height:22px;color:#3d3c40;">{{ line }}</p>
      {% endfor %}
      {% if let Some(label) = button %}<form method="post" style="margin:8px 0 0;">
        <input type="hidden" name="List-Unsubscribe" value="One-Click">
        <button type="submit" style="border:0;border-radius:10px;background:#7c3aed;color:#ffffff;font-size:15px;font-weight:600;padding:12px 22px;cursor:pointer;">{{ label }}</button>
      </form>
      {% endif %}
      {% if let Some((label, url)) = link %}<p style="margin:8px 0 0;font-size:15px;"><a href="{{ url }}" style="color:#7c3aed;">{{ label }}</a></p>
      {% endif %}
    </main>
  </body>
</html>
