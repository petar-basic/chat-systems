# Accepted advisories. Each entry names the crate, why it can't be upgraded, and
# why it's unreachable or unexploitable here. Preferably the crate is in Cargo.lock
# but NOT compiled into either binary; a compiled-in crate needs a concrete reason
# its flaw doesn't apply and the upstream release that lets us drop the entry.
[advisories]
ignore = [
    # rsa (Marvin timing attack). Present only as a lock entry under sqlx's MySQL
    # driver, which we never enable (postgres-only). Not in the build graph:
    # `cargo tree -i rsa` is empty. jsonwebtoken uses the aws_lc_rs provider, not
    # the rust_crypto/rsa path.
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5.5 (timing variability in constant-time ops), fixed in 0.7.6.
    # Pulled in through elliptic-curve 0.13 by web-push 0.11 (jwt-simple, VAPID
    # signing), its latest release, so there is no upgrade path. web-push signs one
    # VAPID JWT per push with our key inside the worker; recovering it would need
    # fine-grained timing of that signing, which isn't observable remotely.
    # Drop this once web-push moves to elliptic-curve 0.14.
    "RUSTSEC-2026-0387",
    # libsqlite3-sys 0.37 (bundled SQLite CVE-2026-119375), fixed in 0.39. Present
    # only as a lock entry under sqlx's SQLite driver, which we never enable
    # (postgres-only). Not in the build graph: `cargo tree -i libsqlite3-sys` is
    # empty. sqlx 0.9.0 is its latest release and pins 0.37. Drop this once sqlx
    # moves to libsqlite3-sys 0.39.
    "RUSTSEC-2026-0459",
]
