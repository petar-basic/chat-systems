[package]
name = "chat-systems-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"

[workspace]

[lib]
name = "chat_systems_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["unstable", "tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
notify-rust = { version = "4.18", features = ["preview-macos-un"] }
rfd = { version = "0.17", default-features = false, features = ["gtk3", "common-controls-v6"] }
tauri-plugin-deep-link = "2"
getrandom = "0.3"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSObject", "NSOperation", "NSString"] }
objc2 = "0.6"
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
