[package]
name = "chat-systems-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"

[workspace]

[lib]
name = "chat_systems_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["unstable", "tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
notify-rust = { version = "4.18", features = ["preview-macos-un"] }
rfd = { version = "0.17", default-features = false, features = ["gtk3", "common-controls-v6"] }
tauri-plugin-deep-link = "2"
getrandom = "0.3"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
