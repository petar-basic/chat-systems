<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add a server</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div class="titlebar" data-tauri-drag-region></div>
    <main>
      <header>
        <img src="icon.png" alt="" width="56" height="56" />
        <h1>Chat Systems</h1>
        <p>Connect to your team's server</p>
      </header>

      <form id="add">
        <label for="address">Server address</label>
        <input
          id="address"
          name="address"
          type="text"
          inputmode="url"
          autocomplete="url"
          autocapitalize="off"
          spellcheck="false"
          placeholder="chat.yourcompany.com"
          required
          autofocus
        />
        <p id="error" role="alert" hidden></p>
        <button type="submit" class="primary">Connect</button>
      </form>

      <section id="saved" hidden>
        <h2>Your servers</h2>
        <ul id="servers"></ul>
      </section>
    </main>
  </body>
</html>
