services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: >
      postgres -c max_connections=40 -c shared_buffers=96MB
               -c work_mem=4MB -c maintenance_work_mem=32MB
               -c effective_cache_size=256MB
    environment:
      POSTGRES_DB: chatsystems
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chatsystems"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192m

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 320m

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      BUCKET_NAME: ${S3_BUCKET:-chatsystems}
    entrypoint: /bin/sh
    command: /init.sh
    volumes:
      - ./docker/minio-init.sh:/init.sh:ro
    restart: "no"

  api:
    image: ghcr.io/petar-basic/chat-systems-backend:${VERSION:-main}
    pull_policy: always
    restart: unless-stopped
    environment:
      SERVICE: chat-api
      PORT: "3000"
      DATABASE_URL: postgres://chat:${POSTGRES_PASSWORD}@postgres:5432/chatsystems
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      INSTANCE_NAME: ${INSTANCE_NAME:-Chat Systems}
      PUBLIC_URL: https://${DOMAIN:?DOMAIN must be set}
      CORS_ORIGINS: https://${DOMAIN}
      STORAGE_BACKEND: s3
      LOCAL_STORAGE_PATH: /data/files
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-chatsystems}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:?SMTP_FROM_ADDRESS must be set}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Chat Systems}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_URLS: ${TURN_URLS:-}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_TTL_SECS: ${TURN_TTL_SECS:-43200}
      PG_POOL_MAX: ${PG_POOL_MAX:-5}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - file_data:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      autoheal: "true"
    deploy:
      resources:
        limits:
          memory: 256m

  # Background consumers. Redis pub/sub fans out to every subscriber, so a
  # second replica duplicates every notification and every webhook delivery.
  worker:
    image: ghcr.io/petar-basic/chat-systems-backend:${VERSION:-main}
    pull_policy: always
    restart: unless-stopped
    environment:
      SERVICE: chat-worker
      PORT: "3005"
      DATABASE_URL: postgres://chat:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/chatsystems
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      PUBLIC_URL: https://${DOMAIN:?DOMAIN must be set}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:?SMTP_FROM_ADDRESS must be set}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Chat Systems}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      LOCAL_STORAGE_PATH: /data/files
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-chatsystems}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      PG_POOL_MAX: ${PG_POOL_MAX:-3}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - file_data:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3005/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      autoheal: "true"
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128m

  realtime:
    image: ghcr.io/petar-basic/chat-systems-backend:${VERSION:-main}
    pull_policy: always
    restart: unless-stopped
    environment:
      SERVICE: chat-realtime
      PORT: "3004"
      DATABASE_URL: postgres://chat:${POSTGRES_PASSWORD}@postgres:5432/chatsystems
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: https://${DOMAIN}
      PG_POOL_MAX: ${PG_POOL_MAX:-3}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3004/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      autoheal: "true"
    deploy:
      resources:
        limits:
          memory: 192m

  frontend:
    image: ghcr.io/petar-basic/chat-systems-frontend:${VERSION:-main}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      - api
      - realtime
    deploy:
      resources:
        limits:
          memory: 64m

  db-backup:
    build:
      context: ./docker
      dockerfile: backup.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_INTERVAL_SECS: ${BACKUP_INTERVAL_SECS:-86400}
      BACKUP_OFFSITE_REMOTE: ${BACKUP_OFFSITE_REMOTE:-}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_ENDPOINT: ${RCLONE_CONFIG_R2_ENDPOINT:-}
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - pg_backups:/backups
    deploy:
      resources:
        limits:
          memory: 96m

  minio-backup:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET_NAME: ${S3_BUCKET:-chatsystems}
      BACKUP_INTERVAL_SECS: ${BACKUP_INTERVAL_SECS:-86400}
    entrypoint: ["/bin/sh", "/minio-backup.sh"]
    volumes:
      - ./docker/minio-backup.sh:/minio-backup.sh:ro
      - minio_backups:/backups
    deploy:
      resources:
        limits:
          memory: 96m

  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 15
      AUTOHEAL_START_PERIOD: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 32m

volumes:
  postgres_data:
  redis_data:
  minio_data:
  file_data:
  pg_backups:
  minio_backups:
